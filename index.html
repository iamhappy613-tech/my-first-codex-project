<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f2">
  <title>词间 · 每天一点，慢慢记住</title>
  <style>
:root {
  color-scheme:light;
  --bg:#f6f7f2;
  --ink:#263c35;
  --muted:#838b83;
  --green:#34765b;
  --line:#e1e5dc;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,a {
  -webkit-tap-highlight-color:transparent;
}

button {
  font:inherit;
  cursor:pointer;
}

button:focus-visible,a:focus-visible {
  outline:3px solid #75aa82;
  outline-offset:5px;
}

button {
  color:inherit;
}

button[hidden],[hidden] {
  display:none!important;
}

.app {
  max-width:1220px;
  margin:auto;
  padding:0 48px;
}

.header {
  height:106px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  gap:20px;
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
  font-size:23px;
  font-weight:700;
  text-decoration:none;
  color:var(--ink);
  letter-spacing:2px;
}

.brand-mark {
  display:grid;
  place-items:center;
  background:var(--green);
  color:#fff;
  width:43px;
  height:43px;
  border-radius:14px 14px 14px 4px;
  font-size:24px;
  font-weight:500;
}

.brand-en {
  display:block;
  font-size:8px;
  letter-spacing:2px;
  font-weight:500;
  margin-top:1px;
}

.header-note {
  font-size:12px;
  color:#90978e;
  letter-spacing:1px;
}

.collection {
  font-size:12px;
  border:1px solid #dce3d7;
  border-radius:30px;
  padding:9px 14px;
  display:flex;
  align-items:center;
  gap:8px;
}

.status-dot {
  height:6px;
  width:6px;
  border-radius:50%;
  background:#72a37b;
}

.intro {
  text-align:center;
  margin:49px 0 34px;
}

.eyebrow {
  font-size:10px;
  letter-spacing:3px;
  color:#8a9983;
  font-weight:600;
}

h1 {
  font-size:30px;
  font-weight:600;
  letter-spacing:1px;
  margin:14px 0 10px;
}

h1>span {
  color:#65a078;
}

.intro p,.results>p {
  font-size:13px;
  color:var(--muted);
  line-height:1.8;
  margin:0;
}

.study {
  width:min(100%,570px);
  margin:auto;
}

.progress-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-size:12px;
}

.round-label {
  font-weight:600;
}

.round-label span {
  color:#92998f;
  font-weight:400;
  margin-left:4px;
}

.progress-count {
  font-size:12px;
  color:#99a092;
  font-variant-numeric:tabular-nums;
  letter-spacing:1px;
}

.progress-count strong {
  font-size:17px;
  color:var(--green);
  font-weight:600;
}

.progress-track {
  height:4px;
  border-radius:5px;
  background:#e4e9de;
  overflow:hidden;
  margin-bottom:23px;
}

.progress-track>div {
  height:100%;
  width:0;
  background:#6c9b71;
  border-radius:5px;
  transition:width .3s;
}

.flashcard {
  width:100%;
  height:310px;
  display:block;
  perspective:1400px;
  background:transparent;
  border:0;
  padding:0;
  text-align:center;
  border-radius:20px;
}

.card-inner {
  position:relative;
  display:block;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .48s cubic-bezier(.2,.65,.3,1);
}

.flashcard.flipped .card-inner {
  transform:rotateY(180deg);
}

.card-face {
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border:1px solid #e4e8dd;
  border-radius:20px;
  background:#fffefa;
  box-shadow:0 10px 35px #34482b07;
  display:flex;
  flex-direction:column;
  padding:24px 28px;
}

.card-back {
  transform:rotateY(180deg);
  background:#fdfef9;
}

.card-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.pill {
  font-size:10px;
  color:#809274;
  background:#f0f3e9;
  padding:6px 9px;
  border-radius:5px;
  letter-spacing:.6px;
}

.card-number {
  font-size:10px;
  color:#adb4a7;
  letter-spacing:1.5px;
}

.word-center {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding-top:13px;
}

.word {
  font-family:Georgia,"Times New Roman",serif;
  font-size:52px;
  letter-spacing:-1px;
  line-height:1.2;
}

.phonetic {
  font-family:Arial,sans-serif;
  font-size:17px;
  color:#90988e;
  margin-top:15px;
}

.word-line {
  height:3px;
  width:27px;
  border-radius:10px;
  background:#cedbc2;
  margin-top:23px;
}

.flip-hint {
  font-size:11px;
  color:#9aA192;
  display:block;
  margin-top:14px;
  letter-spacing:.4px;
}

.flip-icon {
  font-size:18px;
  vertical-align:-1px;
  margin-right:5px;
  color:#97ab88;
}

.definition-center {
  display:flex;
  flex:1;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:7px;
}

.back-word {
  font-family:Georgia,serif;
  font-size:24px;
  color:#577661;
}

.meaning {
  font-size:25px;
  font-weight:600;
}

.example-label {
  font-size:9px;
  letter-spacing:1.3px;
  color:#a4ae9c;
  margin-top:9px;
}

.example {
  font-family:Georgia,serif;
  font-size:17px;
  line-height:1.5;
}

.translation {
  font-size:12px;
  color:#899280;
  line-height:1.5;
}

.actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:22px;
}

.answer-btn {
  min-height:77px;
  display:flex;
  align-items:center;
  text-align:left;
  gap:14px;
  padding:14px 21px;
  border-radius:13px;
  transition:transform .15s,background .15s;
}

.answer-btn:active,.again-btn:active {
  transform:scale(.97);
}

.unknown {
  background:#faf7ef;
  border:1px solid #e8dfcc;
  color:#9a7d44;
}

.unknown:hover {
  background:#f5efdf;
}

.known {
  background:var(--green);
  border:1px solid var(--green);
  color:white;
  box-shadow:0 5px 12px #34765b17;
}

.known:hover {
  background:#286349;
}

.action-symbol {
  font-size:24px;
  font-weight:300;
}

.answer-btn>span:nth-child(2) {
  font-size:17px;
  font-weight:500;
}

.answer-btn small {
  display:block;
  font-size:10px;
  font-weight:400;
  opacity:.65;
  margin-top:4px;
  letter-spacing:.4px;
}

.answer-btn kbd {
  margin-left:auto;
  opacity:.45;
  border:1px solid currentColor;
  padding:0 4px;
  border-radius:4px;
  font-size:11px;
}

.study-tip {
  text-align:center;
  font-size:11px;
  color:#969d8e;
  margin:19px 0 25px;
  line-height:1.7;
}

.study-tip>span {
  margin-right:5px;
  color:#aab69a;
}

.session-stats {
  border-top:1px solid var(--line);
  padding-top:19px;
  display:flex;
  align-items:center;
  gap:24px;
  color:#8d9687;
  font-size:11px;
}

.session-stats>span {
  display:flex;
  gap:7px;
  align-items:center;
}

.session-stats strong {
  font-size:13px;
  font-weight:500;
  color:#596650;
}

.stat-dot {
  width:6px;
  height:6px;
  border-radius:50%;
  display:inline-block;
}

.green {
  background:#79a180;
}

.orange {
  background:#c7af77;
}

.text-button {
  border:0;
  background:none;
  padding:8px 0 8px 10px;
  font-size:11px;
  color:#8a9383;
  margin-left:auto;
  min-height:36px;
}

footer {
  display:flex;
  justify-content:space-between;
  gap:16px;
  margin:48px 0 25px;
  font-size:10px;
  color:#a2aa9b;
  align-items:center;
}

.keyboard-tip {
  display:flex;
  align-items:center;
  gap:6px;
}

footer kbd {
  font:inherit;
  border:1px solid #dce2d5;
  border-radius:3px;
  padding:2px 5px;
  background:#fafbf7;
}

footer .keyboard-tip>span {
  margin:0 3px;
}

.results {
  max-width:570px;
  text-align:center;
  margin:auto;
  background:#fffefa;
  border:1px solid #e4e8dd;
  border-radius:20px;
  padding:35px 25px;
}

.result-icon {
  font-size:42px;
  color:#6c976b;
  display:block;
  margin-bottom:15px;
}

.results .eyebrow {
  font-size:9px;
  letter-spacing:2px;
}

.results h2 {
  font-size:26px;
  margin:15px 0 8px;
}

.score {
  margin-top:28px;
}

.score strong {
  font-family:Georgia,serif;
  font-size:80px;
  font-weight:400;
  color:var(--green);
}

.score>span {
  font-size:23px;
  color:#b2bba8;
}

.score-caption {
  font-size:12px!important;
  margin-bottom:24px!important;
}

.result-details {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:20px 0;
  border-block:1px solid var(--line);
  gap:10px;
}

.result-details>span {
  font-size:11px;
  color:#929b89;
}

.result-details strong {
  display:block;
  font-size:22px;
  font-weight:500;
  color:#55734b;
  margin-top:7px;
}

.remaining-words {
  margin-top:16px!important;
  overflow-wrap:anywhere;
}

.again-btn {
  display:block;
  width:100%;
  background:var(--green);
  color:white;
  border:0;
  border-radius:12px;
  padding:17px;
  margin-top:24px;
  font-size:17px;
}

.again-btn span {
  margin-left:15px;
}

.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

@media(max-width:700px) {
  .app {
    padding:0 22px;
  }
  .header {
    height:83px;
  }
  .header-note {
    display:none;
  }
  .brand {
    font-size:20px;
  }
  .brand-mark {
    width:38px;
    height:38px;
    font-size:22px;
  }
  .collection {
    font-size:10px;
    padding:8px 11px;
  }
  .intro {
    margin:35px 0 29px;
  }
  .eyebrow {
    font-size:9px;
    letter-spacing:2px;
  }
  h1 {
    font-size:clamp(21px,5.4vw,28px);
    letter-spacing:0;
    margin-top:13px;
  }
  .intro p {
    font-size:11px;
  }
  .flashcard {
    height:300px;
  }
  .card-face {
    padding:20px;
  }
  .word {
    font-size:46px;
  }
  .answer-btn {
    padding:13px 16px;
    gap:11px;
    min-height:78px;
  }
  .answer-btn kbd {
    display:none;
  }
  .study-tip {
    font-size:10px;
    margin-bottom:20px;
  }
  .session-stats {
    gap:16px;
  }
  footer {
    justify-content:center;
    margin:33px 0 22px;
    padding-bottom:env(safe-area-inset-bottom);
  }
  footer>span:first-child,.keyboard-tip {
    display:none;
  }
  .results {
    padding:28px 19px;
  }
  .results h2 {
    font-size:24px;
  }
  .results>p {
    font-size:11px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    transition:none!important;
    animation:none!important;
  }
}
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="brand" href="./index.html" aria-label="词间首页"><span class="brand-mark">词</span><span>词间<span class="brand-en">WORDSPACE</span></span></a>
      <span class="header-note">留一点时间，给新的词汇。</span>
      <span class="collection"><span class="status-dot"></span>四级核心词</span>
    </header>

    <main>
      <section class="intro">
        <div class="eyebrow">A LITTLE EVERY DAY</div>
        <h1>每一个词，都是新的一步<span>。</span></h1>
        <p>不用着急，翻开一张卡片，让记忆慢慢发生。</p>
      </section>

      <section class="study" id="study" aria-label="单词学习">
        <div class="progress-heading"><span class="round-label" id="round-label">今日学习 <span>· 第一轮</span></span><span class="progress-count"><strong id="current">01</strong><span> / </span><span id="total">30</span></span></div>
        <div class="progress-track" id="progress" role="progressbar" aria-label="本轮已完成" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0"><div id="progress-fill"></div></div>

        <button class="flashcard" id="flashcard" type="button" aria-label="翻开卡片，查看中文释义和例句" aria-pressed="false">
          <span class="card-inner">
            <span class="card-face card-front">
              <span class="card-top"><span class="pill">CET-4 · 核心词汇</span><span class="card-number" id="card-number">NO. 01</span></span>
              <span class="word-center"><span class="word" id="word"></span><span class="phonetic" id="phonetic"></span><span class="word-line"></span></span>
              <span class="flip-hint"><span class="flip-icon">↻</span> 轻点卡片，揭晓释义</span>
            </span>
            <span class="card-face card-back" aria-hidden="true">
              <span class="card-top"><span class="pill">记住它的含义</span><span class="card-number">MEANING</span></span>
              <span class="definition-center"><span class="back-word" id="back-word"></span><span class="meaning" id="meaning"></span><span class="example-label">EXAMPLE / 例句</span><span class="example" id="example"></span><span class="translation" id="translation"></span></span>
              <span class="flip-hint"><span class="flip-icon">↻</span> 轻点卡片，回到单词</span>
            </span>
          </span>
        </button>

        <div class="actions"><button class="answer-btn unknown" id="unknown"><span class="action-symbol">↺</span><span>不认识<small>待会儿再见</small></span><kbd>←</kbd></button><button class="answer-btn known" id="known"><span class="action-symbol">✓</span><span>认识<small>这个词我记住了</small></span><kbd>→</kbd></button></div>
        <p class="study-tip"><span>✦</span> 不认识也没关系，第一轮结束后会再复习一遍。</p>
        <div class="session-stats" aria-live="polite"><span><i class="stat-dot green"></i>已认识 <strong id="known-count">0</strong></span><span><i class="stat-dot orange"></i>待巩固 <strong id="unknown-count">0</strong></span><button id="restart" class="text-button">重新开始 ↗</button></div>
        <p class="sr-only" id="announcement" role="status"></p>
      </section>

      <section class="results" id="results" hidden aria-labelledby="result-title">
        <span class="result-icon">✦</span><div class="eyebrow">A LITTLE PROGRESS, WELL DONE</div><h2 id="result-title">今天，又进步了一点。</h2><p>30 个单词，一份认真。给坚持的自己一个赞。</p>
        <div class="score"><strong id="score">0</strong><span> / 30</span></div><p class="score-caption">第一轮认识的单词</p>
        <div class="result-details"><span>首次掌握率<strong id="accuracy"></strong></span><span>复习后记住<strong id="review-score"></strong></span><span>仍待巩固<strong id="remaining"></strong></span></div>
        <p id="remaining-words" class="remaining-words"></p><button class="again-btn" id="again">再学一遍 <span>↗</span></button>
      </section>
    </main>
    <footer><span>小小积累，也有大大的力量。</span><span class="keyboard-tip"><kbd>空格</kbd> 翻面 <span>·</span> <kbd>←</kbd> 不认识 <span>·</span> <kbd>→</kbd> 认识</span><span>词间 · 让学习轻一点</span></footer>
  </div>
  <script>
// 完全本地的四级词库；无需网络、账号或构建步骤。
const words = [
  { word: 'achieve', phonetic: '/əˈtʃiːv/', meaning: 'v. 实现；达到', example: 'Small steps help us achieve our goals.', translation: '小小的行动帮助我们实现目标。' },
  { word: 'benefit', phonetic: '/ˈbenɪfɪt/', meaning: 'n. 益处；v. 使受益', example: 'Regular exercise benefits both body and mind.', translation: '规律运动有益身心。' },
  { word: 'challenge', phonetic: '/ˈtʃælɪndʒ/', meaning: 'n. 挑战；v. 向……挑战', example: 'Learning a new language is a challenge.', translation: '学习一门新语言是一项挑战。' },
  { word: 'consider', phonetic: '/kənˈsɪdə(r)/', meaning: 'v. 考虑；认为', example: 'Please consider all the options before you decide.', translation: '请在决定之前考虑所有选项。' },
  { word: 'develop', phonetic: '/dɪˈveləp/', meaning: 'v. 发展；培养', example: 'Reading helps children develop their imagination.', translation: '阅读帮助孩子培养想象力。' },
  { word: 'efficient', phonetic: '/ɪˈfɪʃnt/', meaning: 'adj. 高效的；有效率的', example: 'We need a more efficient way to work.', translation: '我们需要一种更高效的工作方式。' },
  { word: 'environment', phonetic: '/ɪnˈvaɪrənmənt/', meaning: 'n. 环境', example: 'Everyone can help protect the environment.', translation: '每个人都能为保护环境出一份力。' },
  { word: 'essential', phonetic: '/ɪˈsenʃl/', meaning: 'adj. 必不可少的；本质的', example: 'Sleep is essential for good health.', translation: '睡眠对身体健康必不可少。' },
  { word: 'experience', phonetic: '/ɪkˈspɪəriəns/', meaning: 'n. 经验；经历；v. 经历', example: 'Travel gives us valuable experience.', translation: '旅行给予我们宝贵的经历。' },
  { word: 'focus', phonetic: '/ˈfəʊkəs/', meaning: 'v. 集中；n. 焦点', example: 'Try to focus on one task at a time.', translation: '试着一次专注于一项任务。' },
  { word: 'improve', phonetic: '/ɪmˈpruːv/', meaning: 'v. 改善；提高', example: 'Daily practice will improve your English.', translation: '每天练习会提高你的英语水平。' },
  { word: 'independent', phonetic: '/ˌɪndɪˈpendənt/', meaning: 'adj. 独立的；自主的', example: 'She became more independent at university.', translation: '她上大学后变得更加独立。' },
  { word: 'knowledge', phonetic: '/ˈnɒlɪdʒ/', meaning: 'n. 知识；学问', example: 'Books are a rich source of knowledge.', translation: '书籍是丰富的知识来源。' },
  { word: 'maintain', phonetic: '/meɪnˈteɪn/', meaning: 'v. 维持；保养', example: 'It is important to maintain a healthy balance.', translation: '保持健康的平衡很重要。' },
  { word: 'opportunity', phonetic: '/ˌɒpəˈtjuːnəti/', meaning: 'n. 机会；时机', example: 'Every day is an opportunity to learn.', translation: '每一天都是学习的机会。' },
  { word: 'participate', phonetic: '/pɑːˈtɪsɪpeɪt/', meaning: 'v. 参加；参与', example: 'All students can participate in the discussion.', translation: '所有学生都可以参与讨论。' },
  { word: 'patient', phonetic: '/ˈpeɪʃnt/', meaning: 'adj. 耐心的；n. 病人', example: 'Be patient with yourself when learning.', translation: '学习时请对自己多一点耐心。' },
  { word: 'persuade', phonetic: '/pəˈsweɪd/', meaning: 'v. 说服；劝说', example: 'I persuaded my friend to join the club.', translation: '我说服朋友加入了俱乐部。' },
  { word: 'potential', phonetic: '/pəˈtenʃl/', meaning: 'adj. 潜在的；n. 潜力', example: 'Everyone has the potential to grow.', translation: '每个人都有成长的潜力。' },
  { word: 'prefer', phonetic: '/prɪˈfɜː(r)/', meaning: 'v. 更喜欢；宁愿', example: 'I prefer walking to taking the bus.', translation: '比起坐公交车，我更喜欢步行。' },
  { word: 'prevent', phonetic: '/prɪˈvent/', meaning: 'v. 防止；阻止', example: 'Washing your hands helps prevent illness.', translation: '洗手有助于预防疾病。' },
  { word: 'provide', phonetic: '/prəˈvaɪd/', meaning: 'v. 提供；供应', example: 'The library provides a quiet place to study.', translation: '图书馆提供了一个安静的学习场所。' },
  { word: 'reduce', phonetic: '/rɪˈdjuːs/', meaning: 'v. 减少；降低', example: 'We can reduce waste by reusing bags.', translation: '我们可以通过重复使用袋子来减少浪费。' },
  { word: 'require', phonetic: '/rɪˈkwaɪə(r)/', meaning: 'v. 需要；要求', example: 'Good results require time and effort.', translation: '好的结果需要时间和努力。' },
  { word: 'resource', phonetic: '/rɪˈsɔːs/', meaning: 'n. 资源', example: 'Water is a precious natural resource.', translation: '水是一种宝贵的自然资源。' },
  { word: 'responsible', phonetic: '/rɪˈspɒnsəbl/', meaning: 'adj. 负责的；有责任心的', example: 'We are responsible for our own choices.', translation: '我们要对自己的选择负责。' },
  { word: 'significant', phonetic: '/sɪɡˈnɪfɪkənt/', meaning: 'adj. 显著的；重要的', example: 'She made significant progress this month.', translation: '她这个月取得了显著进步。' },
  { word: 'solution', phonetic: '/səˈluːʃn/', meaning: 'n. 解决办法；溶液', example: 'We found a simple solution to the problem.', translation: '我们找到了这个问题的简单解决办法。' },
  { word: 'support', phonetic: '/səˈpɔːt/', meaning: 'v. 支持；n. 支持', example: 'My friends always support my decisions.', translation: '朋友们总是支持我的决定。' },
  { word: 'valuable', phonetic: '/ˈvæljuəbl/', meaning: 'adj. 有价值的；宝贵的', example: 'Your advice was very valuable to me.', translation: '你的建议对我很有价值。' }
];

const $ = (id) => document.getElementById(id);
let queue;
let index;
let round;
let firstKnown;
let missed;
let reviewKnown;
let remaining;
let finished;

function renderCard() {
  const entry = queue[index];
  // 切换单词时直接回到正面，避免回转动画短暂泄露下一个词的释义。
  const inner = document.querySelector('.card-inner');
  inner.style.transition = 'none';
  $('flashcard').classList.remove('flipped');
  $('flashcard').setAttribute('aria-pressed', 'false');
  $('flashcard').setAttribute('aria-label', `${entry.word}，点击查看中文释义和例句`);
  document.querySelector('.card-front').setAttribute('aria-hidden', 'false');
  document.querySelector('.card-back').setAttribute('aria-hidden', 'true');
  for (const key of ['word', 'phonetic', 'meaning', 'example', 'translation']) {
    $(key).textContent = entry[key];
  }
  $('back-word').textContent = entry.word;
  $('current').textContent = String(index + 1).padStart(2, '0');
  $('total').textContent = String(queue.length).padStart(2, '0');
  $('card-number').textContent = `NO. ${String(words.indexOf(entry) + 1).padStart(2, '0')}`;
  $('round-label').innerHTML = round === 1 ? '今日学习 <span>· 第一轮</span>' : '巩固复习 <span>· 最后一轮</span>';
  $('progress').setAttribute('aria-valuemax', queue.length);
  $('progress').setAttribute('aria-valuenow', index);
  $('progress-fill').style.width = `${index / queue.length * 100}%`;
  $('known-count').textContent = firstKnown + reviewKnown;
  $('unknown-count').textContent = missed.length - reviewKnown;
  void inner.offsetWidth;
  inner.style.removeProperty('transition');
}

function start() {
  queue = [...words];
  index = 0;
  round = 1;
  firstKnown = 0;
  missed = [];
  reviewKnown = 0;
  remaining = [];
  finished = false;
  $('study').hidden = false;
  $('results').hidden = true;
  $('announcement').textContent = '';
  renderCard();
}

function flip() {
  if (finished) return;
  const flipped = $('flashcard').classList.toggle('flipped');
  $('flashcard').setAttribute('aria-pressed', String(flipped));
  const entry = queue[index];
  $('flashcard').setAttribute('aria-label', flipped ? `${entry.word}，${entry.meaning}。例句：${entry.example} ${entry.translation}。点击返回单词正面` : `${entry.word}，点击查看中文释义和例句`);
  document.querySelector('.card-front').setAttribute('aria-hidden', String(flipped));
  document.querySelector('.card-back').setAttribute('aria-hidden', String(!flipped));
}

function answer(known) {
  if (finished) return;
  if (round === 1) {
    if (known) firstKnown++;
    else missed.push(queue[index]);
  } else {
    if (known) reviewKnown++;
    else remaining.push(queue[index]);
  }
  index++;
  if (index === queue.length) {
    if (round === 1 && missed.length) {
      round = 2;
      queue = [...missed];
      index = 0;
      $('announcement').textContent = `第一轮结束，现在复习 ${queue.length} 个不认识的单词。`;
    } else {
      finish();
      return;
    }
  }
  renderCard();
}

function finish() {
  finished = true;
  $('study').hidden = true;
  $('results').hidden = false;
  $('score').textContent = firstKnown;
  $('accuracy').textContent = `${Math.round(firstKnown / words.length * 100)}%`;
  $('review-score').textContent = `${reviewKnown} 个`;
  $('remaining').textContent = `${remaining.length} 个`;
  $('remaining-words').textContent = remaining.length ? `下次再加油：${remaining.map(entry => entry.word).join(' · ')}` : '这一轮的词汇都记住了，继续保持！';
  // 把键盘焦点带到结果区，让键盘及读屏用户知道本轮已结束。
  $('result-title').setAttribute('tabindex', '-1');
  $('result-title').focus({ preventScroll: true });
}

$('flashcard').addEventListener('click', flip);
$('known').addEventListener('click', () => answer(true));
$('unknown').addEventListener('click', () => answer(false));
$('restart').addEventListener('click', () => {
  if (window.confirm('重新开始会清空本轮进度，确定重新开始吗？')) {
    start();
    $('flashcard').focus({ preventScroll: true });
  }
});
$('again').addEventListener('click', () => {
  start();
  $('flashcard').focus({ preventScroll: true });
});
document.addEventListener('keydown', (event) => {
  if (finished || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.code === 'Space') {
    // 按钮自身已支持空格触发，保留其原生键盘行为。
    if (document.activeElement.tagName === 'BUTTON' || document.activeElement.tagName === 'A') return;
    event.preventDefault();
    flip();
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    answer(event.key === 'ArrowRight');
  }
});
start();
  </script>
</body>
